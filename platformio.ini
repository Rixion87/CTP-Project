; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -I include

[radio_nrf905]
build_flags = -DRADIO_NRF905
lib_deps = zakkemble/nRF905 Radio Library @ ^4.0.2

[radio_lora]
build_flags = -DRADIO_RFM95
lib_deps = jgromes/RadioLib

[env:uno_nrf905]
extends = radio_nrf905
platform = atmelavr
board = uno 
build_flags = ${env.build_flags} ${radio_nrf905.build_flags} -DNODE_ID=1 -DSEEN_CACHE_SIZE=8 

[env:mega_nrf905]
extends = radio_nrf905
platform = atmelavr
board = megaatmega2560 
build_flags = ${env.build_flags} ${radio_nrf905.build_flags} -DNODE_ID=2 -DSEEN_CACHE_SIZE=32 

[env:mkr1010_rfm95]
extends = radio_lora
platform = atmelsam
board = mkrwifi1010
build_flags = ${env.build_flags} ${radio_lora.build_flags} -DNODE_ID=3

[env:linkvalidation_mkr1010]
extends = env:mkr1010_rfm95
build_Src_filter = <*> +<apps/linkvalidation.cpp>


[env:mkrwan1310]
platform = atmelsam
board = mkrwan1310
framework = arduino
lib_deps = arduino-libraries/MKRWAN 
build_flags = -I include


[env:native]
platform = native
build_flags = -I include -DRADIO_MOCK
