[env]
monitor_speed = 115200
lib_ldf_mode = chain+ 

[arduino_base]
framework = arduino
build_src_filter = +<*> -<apps/>
build_flags = -Wall -I include

[env:linkval_tx]
extends = env:mkrwan1310
build_src_filter = -<*> +<apps/linkvalidation/main1.cpp>

[env:linkval_rx]
extends = env:mkrwan1310
build_src_filter = -<*> +<apps/linkvalidation/main2.cpp>

[radio_nrf905]
build_flags = -DRADIO_NRF905

[radio_lora]
build_flags = -DRADIO_RFM95
lib_deps = jgromes/RadioLib

[env:uno_nrf905]
extends = arduino_base, radio_nrf905
platform = atmelavr
board = uno
build_flags = ${arduino_base.build_flags} ${radio_nrf905.build_flags} -DNODE_ID=1 -DSEEN_CACHE_SIZE=8

[env:mega_nrf905]
extends = arduino_base, radio_nrf905
platform = atmelavr
board = megaatmega2560
build_flags = ${arduino_base.build_flags} ${radio_nrf905.build_flags} -DNODE_ID=2 -DSEEN_CACHE_SIZE=32

[env:mkr1010_rfm95]
extends = arduino_base, radio_lora
platform = atmelsam
board = mkrwifi1010
build_flags = ${arduino_base.build_flags} ${radio_lora.build_flags} -DNODE_ID=3


[env:mkrwan1310]
extends = arduino_base
platform = atmelsam
board = mkrwan1310
lib_deps = arduino-libraries/MKRWAN

[env:native]
platform = native
build_flags = -std=c++17 -I include -DRADIO_MOCK -DNODE_ID=1 -DSEEN_CACHE_SIZE=32 -DMESH_QUIET